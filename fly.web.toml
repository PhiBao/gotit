app = "candor-midnight-web"
primary_region = "iad"

[build]
  dockerfile = "deploy/web.Dockerfile"

  [build.args]
    # Wave 1 contract, deployed on Preprod. Also the fallback the report page uses
    # to explain itself when no v2 contract is configured.
    VITE_CONTRACT_ADDRESS = "e7cf6ffc48ebeb450813104e6a5ab3d585f7e275bcd32e5ea82eb7a8c21dd53d"
    # Wave 2 contract, deployed on Preprod 2026-10-15. Baked in rather than left in
    # localStorage, because localStorage does not travel: a second browser saw
    # "no contract configured" while the data sat on chain, which reads as a broken
    # app rather than a missing setting. Every visitor now sees the same contract.
    VITE_CONTRACT_ADDRESS_V2 = "92fb35dbabd74dc97222c0ce5f7b72f2aed83c6c7d264a5ef94431199720c0d0"
    VITE_ISSUER_KEY = "9aa3811d959df5e7f924d7d487bb4611509bb286181f85144a2cc2c203b2ef1e"
    VITE_HOSTED_PROVER = "true"
    # Blockfrost's Midnight API path. Change to /api/v4/graphql (and the two WS
    # paths) to point at a Midnight-hosted indexer instead.
    VITE_INDEXER_PATH = "/api/v0"
    VITE_INDEXER_WS_PATH = "/api/v0/ws"

[env]
  ISSUER_URL = "https://candor-midnight-issuer.fly.dev"
  ISSUER_HOST = "candor-midnight-issuer.fly.dev"
  # The indexer, which has now moved twice.
  #
  #   1. blockfrost.lw.iog.io         -> 410 Gone when the iog proxy was retired
  #   2. indexer.preprod.midnight.network -> 410 Gone, decommissioned 2026-10-09
  #   3. Blockfrost, authenticated with a project token
  #
  # Now pointed at (3), Blockfrost. It runs the SAME indexer API the
  # Midnight-hosted endpoints served, so only the path and the token differ.
  #
  # REQUIRES A SECRET. Set it once:
  #   fly secrets set -a candor-midnight-web BLOCKFROST_PROJECT_ID=nightpreprod...
  # Without it Blockfrost answers 403 "Missing project token" and the app shows
  # that verbatim, rather than pretending the chain is empty. The Caddyfile adds
  # the header server-side so the token never reaches the browser.
  #
  # VITE_INDEXER_PATH is the build arg that must match this host: /api/v0 for
  # Blockfrost, /api/v4/graphql for a Midnight-hosted endpoint such as
  # indexer.preview.midnight.network (which needs no token).
  INDEXER_URL = "https://midnight-preprod.blockfrost.io"
  INDEXER_HOST = "midnight-preprod.blockfrost.io"
  PROOF_SERVER_URL = "https://candor-midnight-prover.fly.dev"
  PROOF_SERVER_HOST = "candor-midnight-prover.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
