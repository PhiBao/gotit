<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 582" role="img" aria-labelledby="matrix-title matrix-desc">
  <title id="matrix-title">Who can see what in GotIt</title>
  <desc id="matrix-desc">A matrix of four kinds of data against six parties. The individual salary is visible to the employee alone; the published report is visible to everyone.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#f4f2ec"/>
  <text x="336" y="112" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Individual salary</text>
  <text x="336" y="128" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">the witness</text>
  <text x="486" y="112" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Who submitted</text>
  <text x="486" y="128" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">the identity</text>
  <text x="636" y="112" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Group counts</text>
  <text x="636" y="128" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">raw ledger</text>
  <text x="786" y="112" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Published report</text>
  <text x="786" y="128" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">gated figures</text>
  <line x1="24" y1="136" x2="924" y2="136" stroke="#b9b4a5" stroke-width="1"/>
  <text x="32" y="150" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">The employee</text>
  <text x="32" y="165" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">their own device</text>
  <text x="399" y="150" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="549" y="150" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="699" y="150" fill="#4a4f5c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">◐</text>
  <text x="699" y="165" fill="#8b909c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">their own</text>
  <text x="849" y="150" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="849" y="165" fill="#8b909c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">their row</text>
  <line x1="24" y1="168" x2="924" y2="168" stroke="#d5d1c4" stroke-width="0.8"/>
  <rect x="24" y="186" width="900" height="54" fill="rgba(20,22,28,0.015)"/>
  <text x="32" y="204" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">The employer who deployed it</text>
  <text x="32" y="219" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">pays for the ledger</text>
  <text x="399" y="204" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="549" y="204" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="699" y="204" fill="#4a4f5c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">◐</text>
  <text x="699" y="219" fill="#8b909c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">sizes only</text>
  <text x="849" y="204" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <line x1="24" y1="222" x2="924" y2="222" stroke="#d5d1c4" stroke-width="0.8"/>
  <text x="32" y="258" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">The proof server</text>
  <text x="32" y="273" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">builds the proof</text>
  <text x="399" y="258" fill="#4a4f5c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">◐</text>
  <text x="399" y="273" fill="#8b909c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">in transit</text>
  <text x="549" y="258" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="699" y="258" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="849" y="258" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <line x1="24" y1="276" x2="924" y2="276" stroke="#d5d1c4" stroke-width="0.8"/>
  <rect x="24" y="294" width="900" height="54" fill="rgba(20,22,28,0.015)"/>
  <text x="32" y="312" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">The indexer (Blockfrost)</text>
  <text x="32" y="327" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">public state only</text>
  <text x="399" y="312" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="549" y="312" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="699" y="312" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="699" y="327" fill="#8b909c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">enumerable</text>
  <text x="849" y="312" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <line x1="24" y1="330" x2="924" y2="330" stroke="#d5d1c4" stroke-width="0.8"/>
  <text x="32" y="366" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Works council / regulator</text>
  <text x="32" y="381" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">reads without a wallet</text>
  <text x="399" y="366" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="549" y="366" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="699" y="366" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="849" y="366" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <line x1="24" y1="384" x2="924" y2="384" stroke="#d5d1c4" stroke-width="0.8"/>
  <rect x="24" y="402" width="900" height="54" fill="rgba(20,22,28,0.015)"/>
  <text x="32" y="420" fill="#14161c" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif">Anyone on the internet</text>
  <text x="32" y="435" fill="#8b909c" font-size="9" font-family="'Geist Mono',monospace">no account, no key</text>
  <text x="399" y="420" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="549" y="420" fill="#8b909c" font-size="13" font-weight="400" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✕</text>
  <text x="699" y="420" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="849" y="420" fill="#0d6e6e" font-size="13" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">✓</text>
  <text x="24" y="484" fill="#0d6e6e" font-size="12" font-family="'Geist',system-ui,sans-serif">✓</text>
  <text x="40" y="484" fill="#4a4f5c" font-size="9" font-family="'Geist Mono',monospace">visible</text>
  <text x="83.80000000000001" y="484" fill="#4a4f5c" font-size="12" font-family="'Geist',system-ui,sans-serif">◐</text>
  <text x="99.80000000000001" y="484" fill="#4a4f5c" font-size="9" font-family="'Geist Mono',monospace">only in aggregate, or only in transit</text>
  <text x="305.6" y="484" fill="#8b909c" font-size="12" font-family="'Geist',system-ui,sans-serif">✕</text>
  <text x="321.6" y="484" fill="#4a4f5c" font-size="9" font-family="'Geist Mono',monospace">never</text>
  <text x="24" y="518" fill="#14161c" font-size="12" font-family="'Instrument Serif',serif" font-style="italic">The salary column is empty for every party but one. That is the product.</text>
</svg>