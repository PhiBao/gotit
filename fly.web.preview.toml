# Preview network deployment.
#
# WHY THIS FILE EXISTS. On 2026-10-09 Midnight decommissioned its Preprod indexer
# and moved Preprod and Mainnet to Blockfrost, which requires a project token.
# `preview` is the ONE public network Midnight still hosts itself, and it needs
# no token at all. So this is the only configuration that a fresh clone can bring
# up without an account, a credential, or a paid plan — which makes it the right
# target for a demo, and the right default for anyone evaluating the project.
#
# Trade-off, stated plainly: the Wave 1 contract lives on Preprod and is not on
# Preview. Deploying here creates a NEW contract, so the app reads an empty
# ledger until someone runs a reporting period on it. That is the honest starting
# state, and the report page says so rather than filling the table.
#
#   fly deploy -c fly.web.preview.toml
#
# Fund the deployer wallet from the Preview faucet:
#   https://midnight-tmnight-preview.nethermind.dev/
# and switch Lace to the Preview network before connecting.
#
# The app name is separate from the Preprod app on purpose: two networks, two
# deployments, no chance of one serving the other's chain.

app = "candor-midnight-web-preview"
primary_region = "iad"

[build]
  dockerfile = "deploy/web.Dockerfile"

  [build.args]
    # No contract address: Preview has no GotIt deployment yet. Deploy one from
    # the Operator console and it is stored in the browser.
    VITE_HOSTED_PROVER = "true"
    VITE_MIDNIGHT_NETWORK = "preview"
    # Midnight-hosted endpoint, so no token and no proxy credential needed.
    VITE_INDEXER_PATH = "/api/v4/graphql"
    VITE_INDEXER_WS_PATH = "/api/v4/graphql/ws"

[env]
  ISSUER_URL = "https://candor-midnight-issuer.fly.dev"
  ISSUER_HOST = "candor-midnight-issuer.fly.dev"
  # Midnight-hosted and tokenless, per the migration guide's environment
  # reference. This is the whole reason Preview is worth a separate deployment.
  INDEXER_URL = "https://indexer.preview.midnight.network"
  INDEXER_HOST = "indexer.preview.midnight.network"
  PROOF_SERVER_URL = "https://candor-midnight-prover.fly.dev"
  PROOF_SERVER_HOST = "candor-midnight-prover.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
